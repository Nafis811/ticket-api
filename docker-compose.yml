services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickets"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tickets
      PORT: "3000"
      WEBHOOK_SECRET: dev-webhook-secret
      ORDER_TTL_SECONDS: "900"
      EXPIRY_INTERVAL_MS: "30000"
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "3300:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    restart: unless-stopped

  # Uji 200 pesanan bersamaan dari DALAM network Docker.
  #   docker compose --profile tools run --rm loadtest
  # Tidak lewat port-forward host, jadi tidak kena batas koneksi Docker Desktop
  # (di Windows/macOS lonjakan 200 socket dari host bisa ter-reset).
  loadtest:
    profiles: ["tools"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.loadtest
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
