worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log ringkas supaya `docker compose logs nginx` enak dibaca saat demo.
    log_format brief '$remote_addr "$request" $status ${body_bytes_sent}b ${request_time}s';
    access_log /dev/stdout brief;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Connection pool ke backend: jangan bikin koneksi baru untuk tiap request
    # saat uji 200 pesanan bersamaan.
    upstream api_upstream {
        server api:3000;
        keepalive 64;
        keepalive_requests 10000;
    }

    server {
        listen 80 backlog=2048;
        server_name localhost;

        client_max_body_size 1m;

        # Forward all requests to Node.js backend
        location / {
            proxy_pass http://api_upstream;

            # HTTP/1.1 + Connection "" wajib supaya keepalive ke upstream aktif.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
